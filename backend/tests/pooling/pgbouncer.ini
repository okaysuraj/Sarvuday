[databases]
sarvuday_pooler_audit = host=postgres port=5432 dbname=sarvuday_pooler_audit

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = plain
auth_file = /etc/pgbouncer/userlist.txt
pool_mode = transaction
default_pool_size = 2
max_client_conn = 30
max_prepared_statements = 1000
pidfile = /tmp/pgbouncer.pid
