# Set Netlify's Base directory to frontend so it discovers this file.
# Build the web client and let React Router handle browser URLs.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  VITE_API_BASE_URL = "https://sarvuday-backend.onrender.com"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
